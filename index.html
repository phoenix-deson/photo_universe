<script type="module">

const firebaseConfig={apiKey:"AIzaSyDIeaAVvLD9d4L9QAvbTLCZ6N0x0-U1Nwg",authDomain:"friendship-k-h.firebaseapp.com",projectId:"friendship-k-h",storageBucket:"friendship-k-h.firebasestorage.app",messagingSenderId:"791706318386",appId:"1:791706318386:web:5d69e67fb55716ba8e2e2b"};
const db=getFirestore(initializeApp(firebaseConfig));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.0028);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,220);camera.position.set(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.getElementById("app").appendChild(renderer.domElement);
const universe=new THREE.Group();scene.add(universe);const backgroundSpace=new THREE.Group();scene.add(backgroundSpace);const loader=new THREE.TextureLoader();loader.setCrossOrigin("anonymous");

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function buildSpace(){const n=7600,pos=new Float32Array(n*3),col=new Float32Array(n*3);const c1=new THREE.Color(0xffffff),c2=new THREE.Color(0xaec7ff),c3=new THREE.Color(0xffc8df);for(let i=0;i<n;i++){const r=18+Math.pow(Math.random(),.62)*125,arm=(i%6)*(Math.PI*2/6),a=arm+r*.075+gauss()*.11*(.25+r/80),th=gauss()*(1.1+r*.035);pos[i*3]=Math.cos(a)*r+gauss()*.9;pos[i*3+1]=th*.55+Math.sin(r*.02)*.7;pos[i*3+2]=Math.sin(a)*r+gauss()*.9;const c=Math.random()<.1?c3:(Math.random()<.3?c2:c1);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("color",new THREE.BufferAttribute(col,3));backgroundSpace.add(new THREE.Points(g,new THREE.PointsMaterial({size:.095,vertexColors:true,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending})));for(const [x,y,z,s,c,o] of [[-35,14,-52,42,0x6077ff,.045],[28,-16,-58,34,0xa35a95,.028],[-10,28,-82,52,0x6485ff,.022]]){const m=new THREE.Mesh(new THREE.SphereGeometry(s,32,32),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.set(x,y,z);backgroundSpace.add(m)}}
function loadPhotos(){return getDocs(collection(db,"memories")).then(s=>s.docs.map(d=>{const x=d.data(),image=x.image||x.imageUrl||x.url||x.photo;return typeof image==="string"&&image.trim()?{id:d.id,image:image.trim()}:null}).filter(Boolean))}
function layout(n){const density=Math.sqrt(n/Math.max(innerWidth*innerHeight/950000,.7));return{radius:clamp(13.5+Math.sqrt(n)*.78,16,32),size:clamp(4.05-density*.2,2.75,4.0)}}
function addPhoto(record,pos,index,size){const mat=new THREE.SpriteMaterial({transparent:true,opacity:.78,depthWrite:false,color:0xffffff});const s=new THREE.Sprite(mat);s.position.copy(pos);s.userData={record,index,size,ratio:1,target:1,zoom:1};universe.add(s);photos.push(s);loader.load(record.image,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);s.userData.ratio=clamp((t.image.width||1)/(t.image.height||1),.35,3.2);mat.map=t;mat.needsUpdate=true},undefined,()=>mat.opacity=0);return s}
